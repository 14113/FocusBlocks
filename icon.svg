<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="512" cy="512" r="480" fill="url(#bgGrad)"/>

  <!-- Inner subtle circle -->
  <circle cx="512" cy="512" r="420" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Grid of blocks 3x3 with some completed -->
  <g filter="url(#shadow)">
    <!-- Row 1 -->
    <rect x="220" y="220" width="150" height="150" rx="20" fill="url(#activeGrad)"/>
    <rect x="400" y="220" width="150" height="150" rx="20" fill="url(#activeGrad)"/>
    <rect x="580" y="220" width="150" height="150" rx="20" fill="url(#activeGrad)"/>

    <!-- Row 2 -->
    <rect x="220" y="400" width="150" height="150" rx="20" fill="url(#activeGrad)"/>
    <rect x="400" y="400" width="150" height="150" rx="20" fill="url(#activeGrad)"/>
    <rect x="580" y="400" width="150" height="150" rx="20" fill="url(#blockGrad)" opacity="0.9"/>

    <!-- Row 3 -->
    <rect x="220" y="580" width="150" height="150" rx="20" fill="url(#blockGrad)" opacity="0.9"/>
    <rect x="400" y="580" width="150" height="150" rx="20" fill="url(#blockGrad)" opacity="0.9"/>
    <rect x="580" y="580" width="150" height="150" rx="20" fill="url(#blockGrad)" opacity="0.9"/>
  </g>

  <!-- Checkmarks on completed blocks -->
  <g fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 295 L305 330 L360 270"/>
    <path d="M450 295 L485 330 L540 270"/>
    <path d="M630 295 L665 330 L720 270"/>
    <path d="M270 475 L305 510 L360 450"/>
    <path d="M450 475 L485 510 L540 450"/>
  </g>
</svg>
